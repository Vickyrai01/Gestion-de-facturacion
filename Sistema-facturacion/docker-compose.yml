# Base Oracle local para Facturacion.Api (clases 4 a 6).
#
#   docker compose up -d        # la primera vez tarda unos minutos
#   docker compose logs -f oracle   # esperar "DATABASE IS READY TO USE!"
#   docker compose down -v      # borra todo (contenedor y datos)
#
# Los scripts de db/ se ejecutan solo la primera vez, cuando el volumen está vacío.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: facturacion-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: OracleAdmin123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  oracle-data:
